<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b140e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小树" />
  <meta name="format-detection" content="telephone=no" />
  <title>小树 · AI 聊天</title>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preload" as="image" href="assets/clover-bg.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app theme-clover" id="app">
    <div class="bg" id="bg"></div>
    <div class="vignette"></div>
    <div class="scrim scrim-top"></div>
    <div class="scrim scrim-bottom"></div>

    <header class="topbar">
      <button class="glass back-btn" id="backBtn" aria-label="返回消息列表">
        <svg viewBox="0 0 24 24" class="ic"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        <span class="badge" id="unreadBadge">2</span>
      </button>

      <button class="peer" id="peerBtn" aria-label="查看对方的资料">
        <img class="avatar js-peer-avatar" src="assets/avatar.jpg" alt="" />
        <span class="name-pill">
          <span class="js-peer-name">小树</span>
          <svg viewBox="0 0 24 24" class="ic chev"><path d="m9 5 7 7-7 7" /></svg>
        </span>
      </button>

      <button class="glass call-btn" id="callBtn" aria-label="视频通话">
        <svg viewBox="0 0 24 24" class="ic">
          <rect x="2.6" y="6.4" width="13" height="11.2" rx="3.4" />
          <path d="M15.8 10.3 21 7.2v9.6l-5.2-3.1" />
        </svg>
      </button>
    </header>

    <main class="messages" id="messages" aria-live="polite">
      <div class="messages-inner" id="messagesInner"></div>
    </main>

    <div class="composer-dock" id="composerDock">
      <button class="glass plus-btn" id="plusBtn" aria-label="更多操作">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 5.2v13.6M5.2 12h13.6" /></svg>
      </button>
      <div class="composer">
        <input class="subject-input" id="subjectInput" placeholder="主题" maxlength="40" autocomplete="off" enterkeyhint="next" aria-label="主题" />
        <div class="composer-divider"></div>
        <div class="input-row">
          <textarea class="message-input" id="messageInput" rows="1" placeholder="iMessage信息" maxlength="2000" enterkeyhint="send" aria-label="消息内容"></textarea>
          <button class="icon-btn mic-btn" id="micBtn" aria-label="语音输入">
            <svg viewBox="0 0 24 24" class="ic">
              <rect x="9" y="2.8" width="6" height="11" rx="3" />
              <path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0M12 17.8v3.2" />
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" aria-label="发送" hidden>
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 19V5M6.2 10.8 12 5l5.8 5.8" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="home-indicator" aria-hidden="true"></div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作面板"></div>
    </div>

    <div class="call-screen" id="callScreen" hidden>
      <div class="call-bg" id="callBg"></div>
      <div class="call-body">
        <div class="call-avatar-wrap">
          <img class="call-avatar js-peer-avatar" src="assets/avatar.jpg" alt="" />
        </div>
        <div class="call-name js-peer-name">小树</div>
        <div class="call-status" id="callStatus">正在呼叫…</div>
        <div class="call-actions">
          <button class="call-action" id="muteBtn" aria-label="静音">
            <span class="call-action-icon">
              <svg viewBox="0 0 24 24" class="ic">
                <rect x="9" y="2.8" width="6" height="11" rx="3" />
                <path d="M5.6 11.4a6.4 6.4 0 0 0 12.8 0M12 17.8v3.2" />
              </svg>
            </span>
            <span class="call-action-label">静音</span>
          </button>
          <button class="call-action" id="camBtn" aria-label="关闭摄像头">
            <span class="call-action-icon">
              <svg viewBox="0 0 24 24" class="ic">
                <rect x="2.6" y="6.4" width="13" height="11.2" rx="3.4" />
                <path d="M15.8 10.3 21 7.2v9.6l-5.2-3.1" />
              </svg>
            </span>
            <span class="call-action-label">摄像头</span>
          </button>
          <button class="call-action end" id="endCallBtn" aria-label="挂断">
            <span class="call-action-icon">
              <svg viewBox="0 0 24 24" class="ic phone">
                <path d="M4.2 10.5c4.7-4.2 10.9-4.2 15.6 0 .7.6.8 1.7.2 2.4l-1.6 1.7c-.5.5-1.3.6-1.9.2l-2-1.3c-.4-.3-.7-.8-.7-1.3v-1a10 10 0 0 0-3.6 0v1c0 .5-.2 1-.7 1.3l-2 1.3c-.6.4-1.4.3-1.9-.2l-1.6-1.7a1.8 1.8 0 0 1 .2-2.4Z" />
              </svg>
            </span>
            <span class="call-action-label">挂断</span>
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
