name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build (unsigned, device)
        working-directory: ios-app
        run: |
          xcodebuild -project CloverChat.xcodeproj \
            -scheme CloverChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CloverChat.app Payload/
          zip -qry CloverChat.ipa Payload
          ls -lh CloverChat.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloverChat-ipa
          path: ios-app/CloverChat.ipa
